[project]
name = "awesome-kiwi-data"
version = "0.1.0"
description = "A curated list of New Zealand data sources, APIs, registers and portals."
requires-python = ">=3.12"
dependencies = [
    "awesome-list @ git+https://github.com/olitreadwell/awesome-list-template@0afe1aceed3f21ee6c4ac9234ecf026b7fcf0664",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv]
package = false
