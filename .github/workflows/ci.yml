name: CI

# Validates the README structure and checks the site still builds on every
# pull request and push to the default branches.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate README and build site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate README structure
        run: python3 scripts/validate_readme.py

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Lint as an awesome list
        run: npx -y awesome-lint
