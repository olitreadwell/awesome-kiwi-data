name: Deploy Pages site

# Builds a static site from README.md with scripts/build_site.py and deploys
# it to GitHub Pages. This runs only once Pages is enabled for the repository
# (Settings → Pages → Build and deployment → Source: GitHub Actions), which is
# an account-level step the repo owner must do once.

on:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build site from README
        run: python3 scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
