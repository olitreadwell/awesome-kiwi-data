name: Weekly link check

# Checks every link in README.md once a week with lychee. If it finds
# genuinely dead links (404, DNS failure, refused connection), it opens a
# single tracking issue and keeps it updated. Bot-blocked links (403 / 999,
# common for LinkedIn) are NOT treated as failures. Links that have started
# redirecting are listed in the same issue, because a link that lands somewhere
# else is usually the first sign it is about to break. When the links recover,
# the issue is closed automatically.
#
# If issues are disabled on the repository, the check cannot file its report,
# so it raises a workflow warning instead of passing silently. Turn issues on
# with: gh repo edit --enable-issues
#
# geonode.whanganui.govt.nz is excluded because its server breaks lychee's
# HTTP/2 probe (verified 200 over HTTP/1.1 and fine in a browser).

on:
  schedule:
    # Sundays 19:00 UTC, which is Monday morning in New Zealand.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: Check README links
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Bump this to update lychee. Dependabot does not track this pinned URL.
      LYCHEE_VERSION: "v0.24.2"
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install lychee
        run: |
          set -euo pipefail
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o lychee.tar.gz
          tar -xzf lychee.tar.gz
          # v0.24+ release archives extract into a named directory.
          lychee_bin="$(find . -maxdepth 2 -type f -name lychee | head -n 1)"
          sudo mv "$lychee_bin" /usr/local/bin/lychee
          lychee --version

      - name: Run link check
        id: check
        run: |
          set +e
          # Serial requests, with retries: NZTA and some other government
          # sites drop bursts of parallel requests, which showed up as false
          # "connection failed" results at higher concurrency.
          lychee \
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999 \
            --no-progress \
            --max-concurrency 1 \
            --max-retries 5 \
            --retry-wait-time 5 \
            --exclude '^https?://(localhost|127\.0\.0\.1)' \
            --exclude '^https://geonode\.whanganui\.govt\.nz' \
            README.md | tee linkcheck-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Informational only: links that resolve, but no longer at the URL the
      # README lists. Redirects never fail the check; they are listed in the
      # issue body so slow site reshuffles get noticed eventually.
      - name: List redirecting links
        continue-on-error: true
        run: |
          set +e
          lychee \
            --accept 200,201,202,203,204,206,403,429,999 \
            --max-redirects 0 \
            --no-progress \
            --max-concurrency 1 \
            --exclude '^https?://(localhost|127\.0\.0\.1)' \
            --exclude '^https://geonode\.whanganui\.govt\.nz' \
            README.md 2>&1 | grep -E '^\[' > redirects-output.txt
          echo "redirecting links: $(wc -l < redirects-output.txt | tr -d ' ')"

      - name: Open or update issue on dead links
        if: steps.check.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          if [ "$(gh repo view --json hasIssuesEnabled -q .hasIssuesEnabled)" != "true" ]; then
            echo "Issues are disabled for this repository; skipping the tracking issue."
            echo "::warning title=Dead links cannot be reported::Issues are disabled on this repository, so the weekly link check has nowhere to file its report. Run 'gh repo edit --enable-issues' to turn them on."
            exit 0
          fi
          gh label create link-check \
            --color FBCA04 \
            --description "Automated dead-link report" 2>/dev/null || true
          {
            echo "The weekly link check found one or more dead links in \`README.md\`."
            echo ""
            echo "Bot-blocked responses (403 / 999, common for LinkedIn) are not counted here, only 404s, DNS failures, and refused connections."
            echo ""
            echo "Reproduce locally:"
            echo ""
            echo '```'
            echo "lychee README.md"
            echo '```'
            echo ""
            echo "Latest report (run ${{ github.run_id }}, $(date -u +%Y-%m-%dT%H:%MZ)):"
            echo ""
            echo '```'
            cat linkcheck-output.txt
            echo '```'
            if [ -s redirects-output.txt ]; then
              echo ""
              echo "Links that now redirect (they resolve, but not at the URL listed in the README):"
              echo ""
              echo '```'
              cat redirects-output.txt
              echo '```'
            fi
          } > issue-body.md

          existing=$(gh issue list --label link-check --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Re-checked on $(date -u +%Y-%m-%d), dead links still present. Report in the issue body above (run ${{ github.run_id }})."
          else
            gh issue create \
              --title "Dead links found in README" \
              --label link-check \
              --body-file issue-body.md
          fi

      - name: Close issue when links recover
        if: steps.check.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          if [ "$(gh repo view --json hasIssuesEnabled -q .hasIssuesEnabled)" != "true" ]; then
            echo "Issues are disabled for this repository; skipping the tracking issue."
            echo "::warning title=Link check cannot report::Issues are disabled on this repository, so a passing link check has nothing to close."
            exit 0
          fi
          existing=$(gh issue list --label link-check --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body "Link check passed on $(date -u +%Y-%m-%d), no dead links remain. Closing automatically."
            gh issue close "$existing"
          fi
