# Configuration for this list. The engine reads it, the site reads it, and the
# scheduled jobs read it.

name = "Awesome Kiwi Data"
repo_slug = "awesome-kiwi-data"
readme = "README.md"

# Sections that hold entries. "Start here" is a prose summary, so it is not
# listed here and the engine leaves it alone.
sections = [
    "Central government and agencies",
    "Tourism and economic data",
    "Regional councils",
    "City and district councils",
    "Crown Research Institutes (CRIs)",
    "Non-government organisations",
    "Companies",
    "Acknowledgements",
]

[site]
enabled = true

[links]
archive = "off"
exclude = []
allowlist = []

[github]
# Every GitHub link carries stars and a last-push date: make stats fetches them,
# make stats-check verifies them offline.
stats = true
max_age_days = 30
snapshot = "github-stats.json"

[sources]
# Upstream lists to mine for candidates. make sources writes a report; a human
# writes every entry.
lists = [
    "https://raw.githubusercontent.com/public-apis/public-apis/master/README.md",
]
keywords = [
    "new zealand",
    "aotearoa",
    "auckland",
    "wellington",
    "christchurch",
    "data.govt.nz",
    "stats.govt.nz",
]
report = "reports/source-candidates.md"

[tags.type]
API = "⇄"
Data = "▦"
Portal = "☰"
Register = "☑"
Docs = "¶"

[tags.access]
Open = "○"
Key = "◑"
Login = "◕"
Paid = "●"

[tags.status]
Legacy = "⟳"
Archived = "▣"
